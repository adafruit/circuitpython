CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y

# BLE implies the p256-m secp256r1 driver; with it on, the additional curves
# wanted for TLS certificate chains (384/521, brainpool, k1, x25519) are
# unaccelerated, and tf-psa-crypto's driver-only-builds check rejects the
# resulting partial ECC acceleration. Disable the driver so every wanted curve
# uses the builtin implementation and the config check passes.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# Override Kconfig default (3)
CONFIG_BT_BUF_ACL_TX_COUNT=8

CONFIG_UDC_WORKQUEUE_STACK_SIZE=1024
