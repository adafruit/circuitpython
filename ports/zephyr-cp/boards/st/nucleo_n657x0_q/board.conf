# The N6 has no internal flash and the upstream board defconfig sets XIP=n,
# linking the whole image into the RAMLOAD region, which is too small for
# CircuitPython ("Image is too large to fit RAMLOAD configuration"). The
# mcuboot fork's dts/st/nucleo_n657x0_q.dtsi points zephyr,flash at the
# memory-mapped XSPI NOR, so execute in place from the slot0 partition
# instead.
CONFIG_XIP=y
