CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n

CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

CONFIG_LOG=n
CONFIG_ASSERT=n
# The app slot cannot spare flash headroom (slot0 fills the internal flash
# after the 68 KB boot partition): compile the wpa_supplicant debug print
# machinery out as well.
CONFIG_WIFI_NM_WPA_SUPPLICANT_NO_DEBUG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BT=n
# Settings only stores BT bond keys here. With BT off, its NVS backend would
# still need storage_partition, which board.overlay removes.
CONFIG_SETTINGS=n
