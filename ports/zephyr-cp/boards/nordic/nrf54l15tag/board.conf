# Enable UART console (not enabled in the Zephyr board defconfig)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable the controller's Zephyr VS HCI set/get TX power commands, which
# _bleio's start_advertising(tx_power=...) uses. Without this the controller
# rejects the commands and tx power is fixed at the BT_CTLR_TX_PWR default (0 dBm).
# The nRF54L15 radio supports -46 to +8 dBm.
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
