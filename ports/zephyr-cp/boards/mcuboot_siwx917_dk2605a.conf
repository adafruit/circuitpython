# The ROM only boots MCUboot through the RPS header in zephyr.rps. With a .hex
# present, west flash writes that instead and leaves the header page stale.
CONFIG_BUILD_OUTPUT_HEX=n

# Instruction fetch from flash goes through the icache, so turning it off
# before jumping to the app hangs MCUboot.
CONFIG_BOOT_DISABLE_CACHES=n
