CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# The board overlay deletes the Zephyr chosen console/shell/mcumgr nodes:
# CircuitPython drives USB CDC ACM through its own usb_cdc bindings. Turn off
# Zephyr's UART console so nothing references the deleted
# DT_CHOSEN(zephyr_console). SERIAL stays on for the dynamically routed UART.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Enable the ST7789V TFT via the Zephyr display subsystem
CONFIG_DISPLAY=y

# Pin numbers are module pins (MDBT50Q-1MV2 carries the aQFN73 inside).
# The CLUE uses the MDBT50Q-1MV2 module, so pin numbers are module pins.
CONFIG_IOBROKER_PACKAGE_MDBT50Q_1MV2=y
