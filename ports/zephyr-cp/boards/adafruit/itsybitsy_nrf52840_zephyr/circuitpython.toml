CIRCUITPY_BUILD_EXTENSIONS = ["elf", "uf2"]
USB_VID=0x239A
USB_PID=0x8052
NAME="ItsyBitsy nRF52840 Express"
VENDOR="Adafruit"

# Non-Zephyr build of the same board; nvm and CIRCUITPY must sit where it puts them.
counterpart = "nordic/itsybitsy_nrf52840_express"

# Status DotStar, driven with bit-banged SPI; names from [pins].
STATUS_DOTSTAR_DATA = "DOTSTAR_DATA"
STATUS_DOTSTAR_CLOCK = "DOTSTAR_CLOCK"

[pins]
# Pins not on the header connector (see board.overlay), with names copied
# from the ports/ counterpart board's pins.c and resolved to MDBT50Q-1MV2
# module pin numbers through the package pin map selected in board.conf.
SWITCH = 10
APA102_MOSI = 24
DOTSTAR_DATA = 24
APA102_SCK = 26
DOTSTAR_CLOCK = 26
L = 22
LED = 22
BLUE_LED = 22
