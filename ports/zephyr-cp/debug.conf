CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_LOG_MAX_LEVEL=4

CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y

CONFIG_ASSERT=y
CONFIG_LOG_BLOCK_IN_THREAD=y
CONFIG_FRAME_POINTER=y

CONFIG_FLASH_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Quiet the UDC device-controller drivers in the debug build. The DWC2 driver
# logs "Prepare RX 0x%02x doeptsiz 0x%x" (LOG_INF) on every OUT endpoint RX
# prepare, which is noisy. Drop UDC_DRIVER to WRN to keep errors/warnings
# while compiling out INF/DBG. (Shared by all udc drivers; only one is active
# per board.)
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Bluetooth: enable BT host debug logging so success paths print, not just
# LOG_ERR. In particular bt_keys logs "Stored keys for <addr>" (LOG_DBG) on a
# successful bt_keys_store(); without this only the failure message
# "Failed to save keys (err -116)" is visible. Also enable the adjacent
# modules (SMP drives pairing, BT_SETTINGS is the NVS backend that returns
# the store err) so the -EALREADY (-116) store-failure context is complete.
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_BT_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y


# Bump stacks for debug build - verbose logging consumes more stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ISR_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_UDC_NRF_THREAD_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_USBD_MSC_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024

# Bluetooth stacks: debug logging + assertions + LOG_MODE_IMMEDIATE consume
# substantial extra stack in the BT host RX workqueue (runs all event callbacks,
# including SMP/pairing) and the long workqueue (deferred SMP/pairing/crypto +
# NVS bond-key store). Zephyr's own SMP/pairing test app
# (tests/bluetooth/tester/prj.conf) uses 4096 for BT_RX_STACK_SIZE.
# (BT_CTLR_RX_PRIO_STACK_SIZE is bumped in the Zephyr controller Kconfig
# default since it's a hidden symbol. BT_HCI_TX/BT_CTLR_RX are also hidden and
# haven't overflowed — left at their defaults.)
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_LONG_WQ_STACK_SIZE=4096

# ===== Networking: trace the DHCP / DNS / socket path =====
# These answer: did DHCP bind and hand the resolver its server, what errno did
# the DNS query get (getaddrinfo reports the resolver's failures as
# DNS_EAI_SYSTEM, "getaddrinfo failure: -11"), and which socket operation ran
# when a socket crash occurs. The log modules register as net_core, net_if,
# net_ipv4, net_ipv4_dhcpv4, net_tcp, net_sock and net_dns_resolve.
CONFIG_NET_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
# The kernel module logs a mutex lock/unlock line for every single mutex
# operation in the network stack, which drowns the useful net trace; keep the
# kernel at INF.
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_NET_CORE_LOG_LEVEL_DBG=y
CONFIG_NET_IF_LOG_LEVEL_DBG=y
CONFIG_NET_IPV4_LOG_LEVEL_DBG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
CONFIG_NET_TCP_LOG_LEVEL_DBG=y
CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y
CONFIG_DNS_SOCKET_DISPATCHER_LOG_LEVEL_DBG=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y

# The TLS rework's handshake failures surface as a generic mapped ValueError
# ("invalid key"); MBEDTLS_DEBUG_C turns on the mbedtls handshake trace, which
# SSLSocket prints to the REPL as DBG:<mbedtls file>:<line> so the failing
# step of the connection manager's https fetch is visible.
CONFIG_MBEDTLS_DEBUG_C=y

# Keep the logging stacks from overflowing under the extra DBG output.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_NAME=y

# The ENET-QoS RX thread logs every packet at DBG level; its normal build
# stack (2048) is not enough for the debug logging depth.
CONFIG_ETH_NXP_ENET_QOS_RX_THREAD_STACK_SIZE=4096

# Ditto the per-interface network TX/RX queues, which process every received
# packet under the net_if/net_ipv6/net_dhcpv4 DBG logs.
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# ... and the net_mgmt event thread, which runs the carrier/address-add/DHCP
# event callbacks (and their DBG logs) that fire around address setup.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# ... and the socket-service thread, which runs the DNS resolver's poll set
# and every registered socket callback.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# ... and the TCP workqueue, which processes every TCP segment (with the
# net_tcp DBG trace) plus retransmission/timer work.
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
