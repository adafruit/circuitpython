CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_LOG_MAX_LEVEL=4

CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y

CONFIG_ASSERT=y
CONFIG_LOG_BLOCK_IN_THREAD=y
CONFIG_FRAME_POINTER=y

CONFIG_FLASH_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Bluetooth: enable BT host debug logging so success paths print, not just
# LOG_ERR. In particular bt_keys logs "Stored keys for <addr>" (LOG_DBG) on a
# successful bt_keys_store(); without this only the failure message
# "Failed to save keys (err -116)" is visible. Also enable the adjacent
# modules (SMP drives pairing, BT_SETTINGS is the NVS backend that returns
# the store err) so the -EALREADY (-116) store-failure context is complete.
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_BT_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y

# Bump stacks for debug build - verbose logging consumes more stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ISR_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_UDC_NRF_THREAD_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_USBD_MSC_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024

# Bluetooth stacks: debug logging + assertions + LOG_MODE_IMMEDIATE consume
# substantial extra stack in the BT host RX workqueue (runs all event callbacks,
# including SMP/pairing) and the long workqueue (deferred SMP/pairing/crypto +
# NVS bond-key store). Zephyr's own SMP/pairing test app
# (tests/bluetooth/tester/prj.conf) uses 4096 for BT_RX_STACK_SIZE.
# (BT_CTLR_RX_PRIO_STACK_SIZE is bumped in the Zephyr controller Kconfig
# default since it's a hidden symbol. BT_HCI_TX/BT_CTLR_RX are also hidden and
# haven't overflowed — left at their defaults.)
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
