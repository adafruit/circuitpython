# Package pin map for mcxn947_vnl, transcribed from MCXNP184M150F70.pdf,
# section 6.1 Table 93 (Pinmux), 100HLQFP N94 column, with a one-off
# pdftotext -layout parse. Review against the datasheet figure before
# editing by hand; regenerate instead when the datasheet changes.
#
# QFN-style package: 'pin' holds the datasheet's pin number (1..100); the
# pads the package does not bond are omitted, so the numbering has gaps.

# The ``gpio`` column is the pad's global GPIO number (gpio port index * 32
# + pin, the numbering the GPIO controller table resolves) when the pad
# bonds a GPIO controller; pads without it (the analog-only pads) are
# reachable only through the analog APIs.

# The analog-only pads (ANA) carry datasheet pad names:
#   ANA_0 = ADC0_A0 (pin 22, pad 139)
#   ANA_1 = ADC0_B0 (pin 23, pad 150)
#   ANA_14 = OPAMP0_INN (pin 36, pad 178)
#   ANA_18 = OPAMP1_INN (pin 39, pad 179)
#   ANA_4 = ADC1_A0 (pin 26, pad 162)
#   ANA_5 = ADC1_B0 (pin 27, pad 163)
#   ANA_6 = DAC2_OUT (pin 28, pad 176)
#   ANA_7 = unused (pin 29, pad 177)

