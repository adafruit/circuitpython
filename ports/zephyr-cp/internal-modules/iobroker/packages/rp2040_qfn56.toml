# Package pin map for rp2040_qfn56, transcribed from rp2040-datasheet.pdf,
# Table 615 (GPIO pins), with a one-off pdftotext -layout parse. Review
# against the datasheet figure before editing by hand.
#
# RP2040 has a single GPIO port; pads are numbered 0-29 and pad_name uses
# the datasheet's GPIOx naming.

name = "rp2040_qfn56"
socs = ["SOC_RP2040"]

