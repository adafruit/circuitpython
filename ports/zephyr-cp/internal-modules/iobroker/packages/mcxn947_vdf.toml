# Package pin map for mcxn947_vdf, transcribed from MCXNP184M150F70.pdf,
# section 6.1 Table 93 (Pinmux), 184BGA column ("ALL": the same ball
# assignments apply across the family), with a one-off pdftotext -layout
# parse of the datasheet and the workbook's ball map. Review against the NXP package drawing (98ASA01888D) before
# editing by hand; regenerate instead when the datasheet changes.
#
# Ball packages: 'pin' numbers the 184 present balls sequentially in
# row-major order (the datasheet only labels them, e.g. A17), so power
# balls leave gaps; the pad->pin ids come from the package's Pinout
# workbook (MCXNP184M150F70_Pinout.xlsx, VFBGA184 tab).
#

# The ``gpio`` column is the pad's global GPIO number (gpio port index * 32
# + pin, the numbering the GPIO controller table resolves) when the pad
# bonds a GPIO controller; pads without it (the analog-only pads) are
# reachable only through the analog APIs.

# The analog-only pads (Pad type - ANA, no GPIO controller) carry the
# datasheet's ANA_x pad names and integrate into the row-major ball
# numbering; zephyr2cp turns them into pin objects named by their
# pad_name:
#   ANA_0 = ADC0_A0 (ball P3, pad 139)
#   ANA_1 = ADC0_B0 (ball R3, pad 150)
#   ANA_14 = OPAMP0_INN (ball U6, pad 178)
#   ANA_18 = OPAMP1_INN (ball U8, pad 179)
#   ANA_22 = OPAMP2_INN (ball U10, pad 180)
#   ANA_4 = ADC1_A0 (ball T2, pad 162)
#   ANA_5 = ADC1_B0 (ball T3, pad 163)
#   ANA_6 = DAC2_OUT (ball U2, pad 176)
#   ANA_7 = unused (ball U4, pad 177)

