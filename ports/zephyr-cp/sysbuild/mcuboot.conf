# Bootloader-image settings that apply to every board. Bootloader *policy*
# (UF2 vs UART serial recovery, entrance methods, SPI NOR for slot1's device,
# per-board logging to fit small boot partitions) is owned by the mcuboot
# fork (bootloader/mcuboot): its Kconfig defaults decide UF2 vs serial from
# the devicetree's zephyr_udc0, and its conf/<vendor>/<key>.conf fragments
# (applied to this image by boot/zephyr/sysbuild/CMakeLists.txt) layer board
# opt-ins on top. Assigning those symbols here would force one policy onto
# every board, including the USB-less ones that cannot run UF2.

# The bootloader yields the CPU between image loads.
CONFIG_MAIN_THREAD_PRIORITY=0

# Heap for UF2 block tracking bitmap (sized from flash area at runtime) and
# other bootloader allocations.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Detailed USB and entrance logging for debugging (per-board conf fragments
# turn this off where the boot partition is too small for it).
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
# CONFIG_USBD_LOG_LEVEL_DBG=y
# CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
# CONFIG_USBD_MSC_LOG_LEVEL_DBG=y
