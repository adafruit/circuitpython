# The RT1011 has only 128 KB of FlexRAM, so trim to fit the heap.
# - 20 KB main stack, as ports/mimxrt10xx has.
# - The system workqueue peaked at 264 bytes (thread analyzer, CDC traffic,
#   CIRCUITPY writes); the 3072 in prj.conf is for BLE bond saves on nRF54L.
CONFIG_MAIN_STACK_SIZE=20480
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
