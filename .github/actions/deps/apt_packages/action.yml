name: Install apt packages, caching the downloaded files

inputs:
  packages:
    description: 'The apt packages to install, separated by spaces'
    required: true

runs:
  using: composite
  steps:
    - name: Name the cache
      id: cache-name
      run: echo "prefix=apt-$ImageOS-$(echo "$PACKAGES" | sha256sum | cut -c1-16)-" >> $GITHUB_OUTPUT
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ~/apt-archives
        key: ${{ steps.cache-name.outputs.prefix }}
        restore-keys: ${{ steps.cache-name.outputs.prefix }}
    - name: Install packages
      id: install
      # Install from ~/apt-archives first, with no network, so a mirror or DNS outage
      # doesn't fail the job. If a package is missing or out of date, update and download
      # just those. autoclean drops versions the mirror no longer has. The cache key names
      # the .deb files kept, so it changes whenever a package is updated.
      run: |
        mkdir -p ~/apt-archives/partial
        if ! sudo apt-get install -y --no-download -o Dir::Cache::Archives="$HOME/apt-archives" $PACKAGES; then
          # Azure's Ubuntu mirror sometimes stops resolving on the runners. Use Ubuntu's own.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" $PACKAGES
        fi
        sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$(id -un)" ~/apt-archives
        echo "key=$PREFIX$(ls ~/apt-archives | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        PREFIX: ${{ steps.cache-name.outputs.prefix }}
    - name: Save downloaded packages
      if: github.event_name == 'push' && steps.restore.outputs.cache-matched-key != steps.install.outputs.key
      uses: actions/cache/save@v5
      with:
        path: ~/apt-archives
        key: ${{ steps.install.outputs.key }}
