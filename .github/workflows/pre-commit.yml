name: pre-commit

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - name: Set up repository
      uses: actions/checkout@v6
      with:
        submodules: false
        show-progress: false
        fetch-depth: 1
        persist-credentials: false
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"  # minify_html has no Python 3.15 wheel yet
    - name: Set up submodules
      uses: ./.github/actions/deps/submodules
    - name: Set up external
      uses: ./.github/actions/deps/external
    - name: Install dependencies
      uses: ./.github/actions/deps/apt_packages
      with:
        packages: gettext
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
    - name: Make patch
      if: failure()
      run: git diff > ~/pre-commit.patch
    - name: Upload patch
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: patch
        path: ~/pre-commit.patch
